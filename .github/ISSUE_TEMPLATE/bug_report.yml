name: Bug report
description: Something is broken or renders incorrectly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in every field that applies — OBJ
        issues are much easier to fix with the generated manifests and logs.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Version from plugin.json or the zip file name.
      placeholder: "1.0.2"
    validations:
      required: true
  - type: input
    id: mcreator
    attributes:
      label: MCreator version
      placeholder: "2024.4 (2024004)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Minecraft / Fabric versions
      placeholder: "1.20.1, Fabric Loader 0.14.21, Fabric API 0.90.7+1.20.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a block with an OBJ model...
        2. Build and run...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - OBJ block model
        - OBJ item/tool model
        - OBJ armor item model
        - Textures / materials
        - Transforms / GUI rendering
        - Rotations / blockstates
        - Culling / performance
        - Tags / loot tables
        - Plants / TreeGrower
        - GUI / onTick
        - Plugin installation / generation
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and manifests
      description: |
        Paste the relevant `latest.log` lines and the generated
        `obj_models_generated.json` / `obj_items_generated.json` if the issue
        is about rendering.
      render: text
  - type: textarea
    id: model
    attributes:
      label: Model / workspace details
      description: OBJ file name, material names, texture layout, block element settings.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using the latest release of the plugin.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
