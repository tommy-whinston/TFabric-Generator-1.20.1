name: Feature request
description: Suggest a new feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work from the MCreator side?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you tried, or other generators that support this.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - OBJ models
        - Blocks
        - Items and tools
        - Armor
        - Plants
        - GUI
        - Tags and loot tables
        - Documentation
        - Build and CI
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the README first.
          required: true
        - label: This feature is possible on Fabric 1.20.1 without a separate runtime mod.
          required: true
